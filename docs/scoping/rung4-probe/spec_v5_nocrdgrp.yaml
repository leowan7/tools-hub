# Both target chains, both still indexed, absolute coordinates instead of one
# rigid internal-coordinate group: does C_CRDGRP trigger the invariant, or is any
# two-chain indexed target rejected?
fc_binder:
  input: /tmp/rfd4_in/3ave_fc_AB.cif
  contig: "60-120, /0, A10-220, /0, B13-220"
  conditions:
    C_CRD:
      true:
        - select: "sel('A/*/*/[N,CA,C,O]') and not has_nan_coord()"
        - select: "sel('B/*/*/[N,CA,C,O]') and not has_nan_coord()"
    C_SEQ:
      true:
        - select: "sel('A')"
        - select: "sel('B')"
    C_HOT:
      true:
        - select: "sel('A/*/[17, 19, 20, 22, 36, 38, 40, 77]')"
        - select: "sel('B/*/[17, 19, 20, 22, 36, 38, 40, 77]')"
