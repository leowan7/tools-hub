name: Client IP probe (diagnostic)

# A one-shot diagnostic, NOT a monitor. It answers the question left open by
# docs/MEASUREMENT-2026-08-24-per-ip-key-is-not-stable.md: the anonymous per-IP
# limiter keys on _client_ip(), production showed that key VARYING between
# identical requests, and nothing in the app could say what it was resolving to.
# This reads /debug/client-ip, which reports exactly that.
#
# Two deliberate design choices:
#
#   * workflow_dispatch ONLY, no cron. A scheduled production probe attaches a
#     check run to main's HEAD every time it runs, and a failing one reddens the
#     suite -- which blocks same-commit Railway deploys. See "A variable change
#     is not deploying" in ALERTING.md. A diagnostic must not be able to do that.
#
#   * EVERY path exits 0, including an unreachable site or a missing token. Same
#     reason: this job must never be capable of reddening main's check suite. It
#     is read by a human opening the run, not by an alert. If you ever make it
#     assert something, give it its own branch, not main.
#
# The token never leaves Actions: the runner holds the METRICS_TOKEN secret and
# prints only the endpoint's JSON, which deliberately excludes Authorization and
# Cookie (guarded by tests/test_metrics.py).
#
# Run this only AFTER the endpoint is live in production -- it ships with the
# deploy that adds /debug/client-ip, so a run before that deploy just prints
# 404s.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: What does Railway's edge actually send us
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      URL: https://tools.ranomics.com/debug/client-ip
    steps:
      - name: Read /debug/client-ip under several forwarding headers
        run: |
          if [ -z "${METRICS_TOKEN}" ]; then
            echo "::warning title=Probe skipped::METRICS_TOKEN repo secret is not set."
            exit 0
          fi
          AUTH="Authorization: Bearer ${METRICS_TOKEN}"

          echo "=== 1. No forwarding header from us, three times."
          echo "=== If client_ip differs between these, the edge value itself varies,"
          echo "=== which is the finding that made the per-IP tier inert."
          for i in 1 2 3; do
            curl -s --max-time 20 -H "${AUTH}" "${URL}" || echo "(request failed)"
            echo
          done

          echo "=== 2. Single forged value."
          echo "=== client_ip == 192.0.2.111 means the edge forwards ours verbatim."
          curl -s --max-time 20 -H "${AUTH}" -H "X-Forwarded-For: 192.0.2.111" "${URL}" || echo "(request failed)"
          echo

          echo "=== 3. Multi-value forged, distinguishable entries."
          echo "=== Read forwarding_headers to see what the edge appended, if anything."
          curl -s --max-time 20 -H "${AUTH}" -H "X-Forwarded-For: 192.0.2.111, 192.0.2.222" "${URL}" || echo "(request failed)"
          echo

          echo "=== Never fails on purpose; read the JSON above."
          exit 0
