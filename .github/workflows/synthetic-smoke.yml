name: Synthetic smoke (Platform API)

# Tier-2 outage detection (see ALERTING.md). Every 6h, run the live
# end-to-end Platform API smoke from OUTSIDE Railway -- a GitHub-hosted
# runner is an independent vantage point, so it still fires if Railway's
# edge/network is down. Exercises auth, cost-estimate, a real DB-backed
# create, idempotent replay, and read-back against
# https://tools.ranomics.com/api/v1. A non-zero exit fails the job, and
# GitHub emails the repo owner the failed run.
#
# This is the deepest detection layer: it catches failure modes the
# UptimeRobot /health + / monitors and the /readyz probe cannot -- broken
# auth, idempotency, persistence, or response-shape regressions -- even when
# the site still looks "up".
#
# Prerequisites:
#   - Repository secret RK_LIVE_KEY: a member-role Platform API key minted at
#     https://tools.ranomics.com/account/api-keys
#     (Settings > Secrets and variables > Actions > New repository secret).
#
# Cleanup: the smoke withdraws the row it creates. Its final step is
# DELETE /experiments/{id}, which runs whenever the create response carried
# an experiment_id -- including when create's own response-shape assertions
# failed, or the replay or read-back ones did -- and then asserts the
# follow-up read 404s. So a run leaves no public.lab_campaigns row behind
# whether it passes or fails, and there is nothing to bulk-delete on a
# cadence.
#
# Two cases still leak a row, and both fail the job:
#   - withdraw itself fails: the run log prints the experiment_id and the
#     DELETE SQL to drop the row by hand.
#   - the 201 body carries no usable experiment_id at all (not a JSON
#     object, or no experiment_id field): there is no id to withdraw or to
#     print, so the row has to be found via
#     https://tools.ranomics.com/admin/lab-projects.
#
# (The script has a second, service-role cleanup path for its optional quote
# round-trip; it stays dormant here because this job passes only RK_LIVE_KEY.)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch: {}     # manual run, e.g. right after a deploy

concurrency:
  group: synthetic-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Platform API end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RK_LIVE_KEY: ${{ secrets.RK_LIVE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard - RK_LIVE_KEY is set
        run: |
          if [ -z "${RK_LIVE_KEY}" ]; then
            echo "::error::RK_LIVE_KEY repo secret is not set. Mint a member-role key at https://tools.ranomics.com/account/api-keys and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The smoke script uses only the Python standard library, so there is
      # nothing to pip install. It exits 0 on all-pass, non-zero on any
      # failure (which fails this job and triggers the GitHub failure email).
      - name: Run Platform API smoke
        run: python scripts/smoke_platform_api.py
