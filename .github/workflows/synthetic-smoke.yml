name: Synthetic smoke (Platform API)

# Tier-2 outage detection (see ALERTING.md). Every 6h, run the live
# end-to-end Platform API smoke from OUTSIDE Railway -- a GitHub-hosted
# runner is an independent vantage point, so it still fires if Railway's
# edge/network is down. Exercises auth, cost-estimate, a real DB-backed
# create, idempotent replay, and read-back against
# https://tools.ranomics.com/api/v1. A non-zero exit fails the job, and
# GitHub emails the repo owner the failed run.
#
# This is the deepest detection layer: it catches failure modes the
# UptimeRobot /health + / monitors and the /readyz probe cannot -- broken
# auth, idempotency, persistence, or response-shape regressions -- even when
# the site still looks "up".
#
# A SECOND, INDEPENDENT JOB in this file guards DEPLOY DRIFT. It is not a
# step ahead of the smoke, and the two do not depend on each other -- neither
# declares `needs:`, so they run in PARALLEL and both report. That is
# deliberate: as a step it exited non-zero on four of five paths BEFORE the
# smoke ran, so a /health blip deleted the deep end-to-end signal entirely.
# See the comment above the `deploy-drift` job for the reasoning, and do not
# "restore consistency" by folding it back into a step.
#
# Production serving an older commit than main is invisible to every other
# layer, because stale code is still perfectly healthy code. Everything else
# here answers "is production working?"; that job answers "is production the
# thing we merged?", which nothing else asks.
#
# The second step is the ONLY consumer of /metrics. Phase 6 of the anonymous
# rate-limiting plan asks for an alert on REFUSAL rate rather than error rate
# ("a limiter refusing 40% of real users is an outage that does not look like
# one"), and nothing scraped /metrics at all -- no Prometheus, no Grafana, no
# scrape config anywhere in the repo. This runner already has the two things
# that alert needs: it runs outside Railway, and a non-zero exit already emails
# the owner. See scripts/check_refusal_rate.py for what the ratio is and, more
# importantly, what it is not (counters reset on deploy, so it is "since
# container boot", not a windowed rate).
#
# Prerequisites:
#   - Repository secret RK_LIVE_KEY: a member-role Platform API key minted at
#     https://tools.ranomics.com/account/api-keys
#     (Settings > Secrets and variables > Actions > New repository secret).
#   - Repository secret METRICS_TOKEN: any long random string, set to the SAME
#     value as the METRICS_TOKEN service variable on the Railway deployment.
#     Until the repo secret exists the refusal-rate step SKIPS loudly instead
#     of failing -- see the comment on that step -- because it must never be
#     able to block the Platform API smoke above it. Once it IS set, /metrics
#     being unreachable or answering 403 DOES fail the job (deliberately -- a
#     monitor that goes quiet when its own plumbing breaks is the failure mode
#     Phase 6 exists to stop).
#
# Cleanup: the smoke withdraws the row it creates. Its final step is
# DELETE /experiments/{id}, which runs whenever the create response carried
# an experiment_id -- including when create's own response-shape assertions
# failed, or the replay or read-back ones did -- and then asserts the
# follow-up read 404s. So a run leaves no public.lab_campaigns row behind
# whether it passes or fails, and there is nothing to bulk-delete on a
# cadence.
#
# Once the server has answered 201, two cases still leak a row, and both
# fail the job:
#   - withdraw itself fails: the run log prints the experiment_id and the
#     DELETE SQL to drop the row by hand. A connection that drops any time
#     AFTER the create response lands here too, rather than killing the run:
#     _http() turns every transport error into a status=0 sentinel --
#     including the RemoteDisconnected / IncompleteRead /
#     ConnectionResetError family urllib does NOT wrap into URLError -- so
#     the smoke still reaches its summary and still names the row.
#   - the 201 body carries no usable experiment_id at all (not a JSON
#     object, or no experiment_id field): there is no id to withdraw or to
#     print, so the row has to be found via
#     https://tools.ranomics.com/admin/lab-projects.
#
# One further path leaves a row without either bullet applying, because the
# script never learns the row exists: a create that times out or 5xxes after
# the insert. See the "Synthetic smoke FAILED" runbook in ALERTING.md, which
# is the fuller version of this comment.
#
# (The script has a second, service-role cleanup path for its optional quote
# round-trip; it stays dormant here because this job passes only RK_LIVE_KEY.)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch: {}     # manual run, e.g. right after a deploy

concurrency:
  group: synthetic-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Its own job, not a step ahead of the smoke. As a step it exited 1 on four of
  # five paths BEFORE the smoke ran, so a /health blip deleted the deep
  # end-to-end signal entirely -- and its own message told the reader to compare
  # against "the smoke below", a result its placement guaranteed would not
  # exist. Separate jobs run independently and both report.
  deploy-drift:
    name: Production is running current code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # merge-base and rev-list need real ancestry; depth-1 has none. This
          # also fetches every remote branch, which is why the "is it on main"
          # gate below is load-bearing rather than paranoid.
          fetch-depth: 0

      # A merge to main does NOT reliably redeploy. On 2026-08-20 Railway
      # created no deployment at all for 2ec3cce (#173) -- no entry in its
      # history, not even a skipped one, with Watch Paths empty so nothing
      # filtered it out -- and production served the previous commit for 8.6
      # hours. Nothing detected it and nothing could have: stale code is still
      # healthy code, so every other layer here was correctly green throughout.
      #
      # This is the only check that asks "is production the thing we merged?"
      # rather than "is production working?".
      - name: Compare the deployed build against main
        env:
          HEALTH_URL: https://tools.ranomics.com/health
          # Observed deploy latency for #174 was ~4 minutes end to end, so this
          # is roughly 5x headroom. It is a bound on how long a legitimate
          # deploy may take, NOT a tuning knob: raising it widens the window in
          # which real drift goes unreported.
          GRACE: '20 minutes ago'
          # Always the remote ref, never HEAD. On workflow_dispatch from a
          # branch -- which the `workflow_dispatch` trigger above allows --
          # HEAD is that branch, and
          # comparing production against unmerged WIP reports drift that does
          # not exist.
          MAIN_REF: refs/remotes/origin/main
        run: |
          set -euo pipefail

          BODY=$(curl -fsS --max-time 20 "$HEALTH_URL") || {
            echo "::error::Could not read ${HEALTH_URL} (unreachable, timed out, or non-2xx). This says nothing about deploy drift either way -- read the Platform API smoke job, which runs independently, to tell an outage from a blip."
            exit 1
          }

          # Not "// empty": the endpoint reports the literal string "unknown"
          # when RAILWAY_GIT_COMMIT_SHA is unset (blueprints/public.py,
          # _build_sha), so the likeliest misconfiguration arrives as a VALUE,
          # never as an absent field. Requiring a hex object name catches that,
          # and also catches ref names like "main" or "HEAD" -- which git would
          # happily resolve locally and certify a pass against.
          DEPLOYED=$(printf '%s' "$BODY" | jq -r '.build // empty' 2>/dev/null || true)
          if ! printf '%s' "$DEPLOYED" | grep -Eq '^[0-9a-f]{7,40}$'; then
            # Truncate the BODY, not DEPLOYED: jq's parse error is swallowed
            # above, so a 2xx serving non-JSON (an edge error page) arrives
            # here with DEPLOYED EMPTY, and the operator would be told "no
            # build field" while never seeing what was actually served.
            SAFE=$(printf '%s' "${DEPLOYED:-<no build field; body was: ${BODY}>}" | tr -dc '[:print:]' | cut -c1-200)
            echo "::error::/health did not report a commit SHA (got: ${SAFE}). Deploy drift CANNOT be detected until this is fixed -- check RAILWAY_GIT_COMMIT_SHA on the web service. A pass here would be meaningless, so this fails instead."
            exit 1
          fi

          if ! git cat-file -e "${DEPLOYED}^{commit}" 2>/dev/null; then
            echo "::error::Production reports build ${DEPLOYED}, which is not a commit in this repository at all."
            exit 1
          fi

          # Forward ancestry alone is a FALSE PASS waiting to happen: it asks
          # only "is production at or ahead of the bar", so a commit deployed by
          # hand from any pushed branch descending from the bar answers yes.
          # fetch-depth 0 puts every such branch in this clone, so git resolves
          # it happily. Production must be ON main.
          if ! git merge-base --is-ancestor "$DEPLOYED" "$MAIN_REF"; then
            echo "::error::Production is running ${DEPLOYED:0:7}, which is NOT an ancestor of main. It was deployed from a branch rather than from main -- check the Railway deployment's source before redeploying."
            exit 1
          fi

          # --first-parent, because a merge-commit PR splices side-branch
          # commits into main's ancestry carrying their ORIGINAL committer
          # dates (this repo allows merge commits and has 162 of them, and
          # committer dates on main run up to ~72h LATER than author dates).
          # Without it, rev-list can return a just-arrived commit already older
          # than the window, and the grace window stops protecting anything.
          BAR=$(git rev-list -1 --first-parent --before="$GRACE" "$MAIN_REF")
          if [ -z "$BAR" ]; then
            echo "No commit on main is older than '${GRACE}'; nothing to compare against yet."
            exit 0
          fi

          if git merge-base --is-ancestor "$BAR" "$DEPLOYED"; then
            echo "OK: production at ${DEPLOYED:0:7}, on main and at or ahead of ${BAR:0:7}."
            exit 0
          fi

          echo "::error::DEPLOY DRIFT -- production is running ${DEPLOYED:0:7} but ${BAR:0:7} landed on main $(git log -1 --format=%cr "$BAR") and never shipped. Redeploy the web service from the Railway dashboard; full runbook under 'Deploy drift detected' in ALERTING.md."
          echo "Merged but NOT in production:"
          git log --oneline --no-decorate "${DEPLOYED}..${MAIN_REF}"
          exit 1

  smoke:
    name: Platform API end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RK_LIVE_KEY: ${{ secrets.RK_LIVE_KEY }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Guard - RK_LIVE_KEY is set
        run: |
          if [ -z "${RK_LIVE_KEY}" ]; then
            echo "::error::RK_LIVE_KEY repo secret is not set. Mint a member-role key at https://tools.ranomics.com/account/api-keys and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The smoke script uses only the Python standard library, so there is
      # nothing to pip install. It exits 0 on all-pass, non-zero on any
      # failure (which fails this job and triggers the GitHub failure email).
      #
      # This is Tier 2 and it is PRE-EXISTING. Nothing added later may be able
      # to stop it running: every step above it is either setup or a guard on
      # its OWN credential (RK_LIVE_KEY).
      - name: Run Platform API smoke
        run: python scripts/smoke_platform_api.py

      # Same rules: stdlib only, non-zero exit fails the job. Deliberately the
      # LAST step, and deliberately unable to take out the step above it:
      #
      #   * It runs AFTER the API smoke so an outright outage is reported as an
      #     outage rather than as an unreachable /metrics.
      #   * Its METRICS_TOKEN precondition is checked HERE, in the step that
      #     needs it, NOT as an earlier guard step. An earlier guard would exit
      #     non-zero before scripts/smoke_platform_api.py ever ran, silently
      #     taking ALERTING.md's Tier 2 monitor offline for the whole window
      #     between this merging and Leo setting the secret.
      #   * An unset METRICS_TOKEN SKIPS this check instead of failing the job,
      #     so a not-yet-configured NEW alarm degrades to "the new check is not
      #     running yet" rather than "the old check is dead". The skip is loud
      #     on purpose -- a ::warning:: annotation plus a job-summary block --
      #     so a green tick can never be read as "refusal rate is fine" when it
      #     means "nobody looked". Not continue-on-error: every OTHER failure
      #     of this step is a real failure and still fails the job.
      #
      # check_refusal_rate.py exits 2 by itself when METRICS_TOKEN is unset,
      # which is the right answer for a human running it by hand. Here we
      # pre-empt it: a pending manual action is not an incident.
      #
      # Thresholds are overridable here without a code change --
      # REFUSAL_RATE_THRESHOLD (default 0.20) and REFUSAL_RATE_MIN_SAMPLES
      # (default 50, the denominator below which the check reports and skips
      # because the counters reset on deploy).
      - name: Check Epitope Scout refusal rate
        run: |
          if [ -z "${METRICS_TOKEN}" ]; then
            echo "::warning title=Refusal-rate check SKIPPED::METRICS_TOKEN repo secret is not set, so the Epitope Scout refusal-rate alarm did NOT run. Generate one (e.g. openssl rand -hex 32), add it under Settings > Secrets and variables > Actions, and set the SAME value as a METRICS_TOKEN service variable on the Railway deployment."
            {
              echo "### Refusal-rate check SKIPPED"
              echo ""
              echo "\`METRICS_TOKEN\` is not set, so the Epitope Scout refusal-rate alarm is **not running**."
              echo "The Platform API smoke (Tier 2) above ran normally."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          # Run it, keep its exit code, and surface the key-source NOTE on the
          # run PAGE rather than only in this log. A passing job's log is not
          # read, which is how /metrics sat with no consumer for months; the
          # step summary is the same trick the token-skip above uses. The exit
          # code is preserved exactly, so this cannot turn a pass into a fail
          # or the reverse.
          set +e
          out="$(python scripts/check_refusal_rate.py)"
          rc=$?
          set -e
          echo "${out}"
          # A SKIP exits 0 and so looks exactly like a healthy run. When the
          # skip swallowed real refusals, say so on the run PAGE. This is a
          # PASSIVE signal: the job stays green, so GitHub sends no email and
          # somebody has to open the run. That is a deliberate trade -- a fail
          # path here reddens main's suite and a red suite blocks Railway
          # deploys (ALERTING.md) -- but do not mistake it for a page. If this
          # ever needs to reach someone unprompted, the runner has `gh` and
          # GITHUB_TOKEN: create-or-comment on a dedupe-titled issue notifies
          # and persists without touching the check suite.
          if printf '%s' "${out}" | grep -q "UNRATED REFUSALS:"; then
            unrated="$(printf '%s' "${out}" | grep "UNRATED REFUSALS:" | head -1)"
            echo "::warning title=Refusal-rate alarm could not evaluate::${unrated}"
            {
              echo "### Refusal-rate alarm could not evaluate"
              echo ""
              echo "Anonymous refusals happened, but too few metered requests to rate them."
              echo "The alarm passed because it had nothing to compare against, **not** because traffic is healthy."
              echo ""
              echo '```'
              # The WHOLE report, deliberately -- it is ~12 lines. An earlier
              # version grepped for the five policy reasons, which silently
              # dropped any reason added later: the count landed in the total
              # while its row vanished, rendering "3 refusal(s)" above five
              # zeros. A pattern that has to be kept in sync with the producer
              # is the same drift this block exists to make visible.
              printf '%s\n' "${out}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          if printf '%s' "${out}" | grep -q "NOTE:"; then
            {
              echo "### Epitope Scout rate-limit key source changed"
              echo ""
              echo "The per-IP limiter is no longer keying on X-Real-Ip. Read the"
              echo "arrows below for which failure this is -- they are opposites."
              echo ""
              echo '```'
              printf '%s' "${out}" | grep -A6 "NOTE:"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          exit $rc
