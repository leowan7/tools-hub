name: Deploy Modal apps

# Auto-deploys the atomic tools-hub Modal apps on push to main.
#
# Apps (one Modal deploy per matrix job):
#   - mpnn             (tools/mpnn/modal_app.py)
#   - af2              (tools/af2/modal_app.py)
#   - colabfold        (tools/colabfold/modal_app.py)
#   - esmfold          (tools/esmfold/modal_app.py)
#   - boltz2           (tools/boltz2/modal_app.py)
#   - esmfold2_design  (tools/esmfold2_design/modal_app.py)
#   - iggm             (tools/iggm/modal_app.py)
#   - proteina         (tools/proteina/modal_app.py)
#   - opendde          (tools/opendde/modal_app.py)
#
# Prerequisites:
#   - Repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are set.
#   - Each tools/<tool>/modal_app.py exists at HEAD.
#
# Matrix strategy: one job per app so a single-app failure does not abort the
# other three. `fail-fast: false` is required so prod deploys are attempted
# independently.

on:
  push:
    branches: [main]
    paths:
      # meta.py, example/ and __init__.py are WEB-TIER ONLY — no
      # Dockerfile.modal COPYs them and no modal_app.py add_local_*s them (the
      # only tools-side file any image gets is that app's own run_pipeline.py),
      # so an edit there cannot change a container. Excluding them stops
      # web-tier-only PRs from redeploying all nine GPU images. The meta.py
      # importers are tools/pxdesign/__init__.py and
      # tools/rfdiffusion/__init__.py, both re-exporting for templates.
      #
      # __init__.py holds the Flask-side adapter class. `modal deploy
      # tools/<slug>/modal_app.py` loads that file in SCRIPT mode, so its
      # __package__ is "" and Modal mounts the single file, not the `tools`
      # package (FunctionInfoType.FILE).
      #
      # tests/test_deploy_paths_exclusions.py is what keeps that true, three
      # ways. (1) It runs Modal's own loader over each of the nine apps in a
      # subprocess and fails if the resulting upload set — entrypoint mount,
      # spec mounts, every image mount layer and build-context mount, and every
      # layer's DockerfileSpec.context_files — contains any __init__.py.
      # (2) It also fails statically on a package import, on a COPY of any tools-side
      # __init__.py from a Dockerfile.modal or from .dockerfile_commands([...]),
      # and on any modal.Image method outside a reviewed allowlist read off
      # dir(modal.Image) — that is what covers the context_files family
      # (pip_install_from_requirements, poetry_install_from_file, uv_sync, ...)
      # and any method a future Modal adds. add_local_file and from_dockerfile
      # are allowed but must name the app's own run_pipeline.py /
      # Dockerfile.modal; mounts=, context_dir=, context_files= and spec_file=
      # are refused outright. So are the spellings that hide a keyword or a
      # method name from an AST read: a `**` expansion into an Image method
      # (kwarg names unknowable), a callee that is not a plain name
      # (`getattr(image, "uv_sync")(...)`), and an Image method BOUND to a
      # variable instead of called. Each was measured to ship an adapter as
      # DockerfileSpec.context_files; check 1 now catches all three by reading
      # the layer rather than the source. (3) It pins the
      # Deploy step below to a FILE path: every line in this job whose shell
      # TOKENS include `deploy`, comment lines stripped, must be the
      # `modal deploy "$app_file"` form, because `modal deploy -m
      # tools.<app>.modal_app` would load the same source in PACKAGE mode and
      # mount the whole tools package. Tokens, not a substring: `modal  deploy`
      # with one extra space is a typo, and a substring selector would never
      # examine it. Do not change that line either.
      #
      # Four known gaps. Two are LOUD rather than silent, so neither can leave
      # a stale image behind: `ADD` (Modal's COPY parser ignores it, so the
      # docker build fails) and importlib/__import__ of the package
      # (ImportError inside the container). Two are silent and accepted: a
      # local-path KWARG that a future Modal adds to an already-allowlisted
      # method and routes through context_files, and a deploy command assembled
      # into a variable and run via `eval` (the token scan reads written lines).
      # Detail in that file's docstring.
      #
      # Order matters: a later negation wins over the earlier 'tools/**'.
      - 'tools/**'
      - '!tools/**/meta.py'
      - '!tools/**/example/**'
      - '!tools/**/__init__.py'
      # static/example/ is NOT web-tier only: four Dockerfile.modal files COPY a
      # fixture out of it as their in-image smoke target. static/ is outside
      # tools/, so these matched NO trigger at all and editing one left four
      # images stale with nothing red to say so. A different path from the
      # '!tools/**/example/**' negation above, which covers per-tool
      # tools/<slug>/example/ dirs.
      #
      # "Four" is how many images the fixture CHANGES, not how many redeploy.
      # The matrix below has no per-path routing, so any entry here that fires
      # redeploys all nine apps; the other five just rebuild identically. That
      # is the matrix's shape, not something these three entries introduce.
      #
      # These three sit AFTER every negation and are unaffected by the ordering
      # rule above in both directions: no 'tools/**' negation can match a
      # 'static/' path, so none of them cancels these, and each is a literal
      # file path under static/, so none of them re-includes anything a
      # negation excludes. They are last only to keep the negation block
      # contiguous under the 'tools/**' it qualifies.
      #
      # Listed file-by-file, not as 'static/example/**': the other two fixtures
      # there are docs-only, and a glob would rebuild all nine GPU images to
      # ship a file no image contains — the same waste the negations above
      # exist to prevent. Safe to keep tight because
      # tests/test_deploy_trigger_covers_dockerfile_copies.py fails if any
      # Dockerfile COPYs a path no trigger here covers, so a fourth fixture
      # cannot be baked in without this list growing to match.
      - 'static/example/BPTI.fasta'      # af2
      - 'static/example/ubiquitin.fasta' # colabfold, esmfold
      - 'static/example/1HEW.pdb'        # mpnn
      - '.github/workflows/deploy-modal.yml'
  workflow_dispatch:

concurrency:
  group: deploy-modal-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - mpnn
          - af2
          - colabfold
          - esmfold
          - boltz2
          - esmfold2_design
          - iggm
          - proteina
          - opendde

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Modal client
        run: |
          python -m pip install --upgrade pip
          # Pin to a known-working Modal client version; bump deliberately.
          pip install 'modal>=1.4,<2'

      - name: Verify Modal auth
        run: |
          modal app list >/dev/null

      - name: Deploy ${{ matrix.app }}
        id: deploy
        run: |
          set -euo pipefail
          app_file="tools/${{ matrix.app }}/modal_app.py"
          if [ ! -f "$app_file" ]; then
            echo "::error::$app_file not found"
            exit 1
          fi
          echo "Deploying $app_file"
          modal deploy "$app_file" | tee "deploy-${{ matrix.app }}.log"

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-deploy-log-${{ matrix.app }}
          path: deploy-${{ matrix.app }}.log
          if-no-files-found: warn
