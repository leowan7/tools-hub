name: Deploy Modal apps

# Auto-deploys the atomic tools-hub Modal apps on push to main.
#
# Apps (one Modal deploy per matrix job):
#   - mpnn             (tools/mpnn/modal_app.py)
#   - af2              (tools/af2/modal_app.py)
#   - colabfold        (tools/colabfold/modal_app.py)
#   - esmfold          (tools/esmfold/modal_app.py)
#   - boltz2           (tools/boltz2/modal_app.py)
#   - esmfold2_design  (tools/esmfold2_design/modal_app.py)
#   - iggm             (tools/iggm/modal_app.py)
#   - proteina         (tools/proteina/modal_app.py)
#   - opendde          (tools/opendde/modal_app.py)
#
# Prerequisites:
#   - Repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are set.
#   - Each tools/<tool>/modal_app.py exists at HEAD.
#
# Matrix strategy: one job per app so a single-app failure does not abort the
# other three. `fail-fast: false` is required so prod deploys are attempted
# independently.

on:
  push:
    branches: [main]
    paths:
      # meta.py, example/ and __init__.py are WEB-TIER ONLY — no
      # Dockerfile.modal COPYs them and no modal_app.py add_local_*s them
      # (each only ships its own run_pipeline.py), so an edit there cannot
      # change a container. Excluding them stops web-tier-only PRs from
      # redeploying all nine GPU images. The meta.py importers are
      # tools/pxdesign/__init__.py and tools/rfdiffusion/__init__.py, both
      # re-exporting for templates.
      #
      # __init__.py holds the Flask-side adapter class. `modal deploy
      # tools/<slug>/modal_app.py` loads that file in SCRIPT mode, so its
      # __package__ is "" and Modal mounts the single file, not the `tools`
      # package (FunctionInfoType.FILE).
      #
      # tests/test_deploy_paths_exclusions.py is what keeps that true. It runs
      # Modal's own loader over each of the nine apps in a subprocess and fails
      # if the resulting upload set — entrypoint mount, spec mounts, and every
      # image mount layer and build-context mount — contains any __init__.py, so
      # it catches a local-source mount however it is spelled. It also fails
      # statically on a package import, on an add_local_*/mounts= of anything
      # but the app's own run_pipeline.py, and on a COPY of any tools-side
      # __init__.py from a Dockerfile.modal or from .dockerfile_commands([...]).
      # It also pins the Deploy step below to a FILE path: `modal deploy -m
      # tools.<app>.modal_app` would load the same source in PACKAGE mode and
      # mount the whole tools package, so do not change that line either.
      #
      # Two known gaps, both LOUD rather than silent, so neither can leave a
      # stale image behind: `ADD` (Modal's COPY parser ignores it, so the docker
      # build fails) and importlib/__import__ of the package (ImportError inside
      # the container). Detail in that file's docstring.
      #
      # Order matters: a later negation wins over the earlier 'tools/**'.
      - 'tools/**'
      - '!tools/**/meta.py'
      - '!tools/**/example/**'
      - '!tools/**/__init__.py'
      - '.github/workflows/deploy-modal.yml'
  workflow_dispatch:

concurrency:
  group: deploy-modal-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - mpnn
          - af2
          - colabfold
          - esmfold
          - boltz2
          - esmfold2_design
          - iggm
          - proteina
          - opendde

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Modal client
        run: |
          python -m pip install --upgrade pip
          # Pin to a known-working Modal client version; bump deliberately.
          pip install 'modal>=1.4,<2'

      - name: Verify Modal auth
        run: |
          modal app list >/dev/null

      - name: Deploy ${{ matrix.app }}
        id: deploy
        run: |
          set -euo pipefail
          app_file="tools/${{ matrix.app }}/modal_app.py"
          if [ ! -f "$app_file" ]; then
            echo "::error::$app_file not found"
            exit 1
          fi
          echo "Deploying $app_file"
          modal deploy "$app_file" | tee "deploy-${{ matrix.app }}.log"

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-deploy-log-${{ matrix.app }}
          path: deploy-${{ matrix.app }}.log
          if-no-files-found: warn
